<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ClientCorp Files — probe</title>

<!--
  DIAGNOSTIC CARD, not a deliverable. Purpose: find out whether — and how —
  file attachments on a ClientCorporation record can be read via AppBridge
  at all, before building anything that depends on it.

  Why this needs testing rather than trusting the docs: the public REST API
  reference does not list a fileAttachments association on ClientCorporation
  (unlike Candidate and JobOrder, which do). The FILES tab visible on a real
  ClientCorporation record proves attachments exist there somehow — so this
  tries every plausible read path and reports, per path, exactly what came
  back: success + row count, an empty result, or the literal error. No path
  is assumed to work. No content is parsed or summarised here — that comes
  after this establishes which path is real.

  Same post-robot pin as the forecast card, and for the same reason: it is
  the exact build Bullhorn's AppBridge listener was written against, not a
  guessed version. See the comment in forecast-card.html for the story.
-->
<script src="https://cdn.jsdelivr.net/gh/krakenjs/post-robot@7da06445/dist/post-robot.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#fff;color:#202124;font-size:13px;line-height:1.5}
.hide{display:none!important}
.hdr{padding:12px 14px;border-bottom:1px solid #e0e3e7;display:flex;justify-content:space-between;
  align-items:center;gap:10px;flex-wrap:wrap}
.hdr h1{font-size:14px;font-weight:700}
.hdr p{font-size:11px;color:#5f6368;margin-top:2px}
.pill{font-size:11px;padding:2px 9px;border-radius:999px;background:#fef7e0;color:#b06000;
  border:1px solid #f5deb0;font-weight:500;white-space:nowrap}
.wrap{padding:12px 14px}
.probe{border:1px solid #e0e3e7;border-radius:8px;margin-bottom:10px;overflow:hidden}
.probe-hd{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#f8f9fa;
  border-bottom:1px solid #eceff1}
.stat{width:18px;height:18px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;color:#fff}
.stat.pending{background:#dadce0;color:#5f6368}
.stat.ok{background:#1e8e3e}
.stat.empty{background:#f29900}
.stat.fail{background:#d93025}
.probe-name{font-size:12.5px;font-weight:500;flex:1;min-width:0}
.probe-url{font-size:10.5px;color:#5f6368;font-family:ui-monospace,Consolas,monospace;
  padding:8px 12px;border-bottom:1px solid #eceff1;word-break:break-all;background:#fff}
.probe-result{padding:9px 12px;font-size:12px}
.probe-result.fail{color:#c5221f}
.probe-result.empty{color:#b06000}
.rows{margin-top:6px;border:1px solid #eceff1;border-radius:6px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;padding:6px 9px;background:#f8f9fa;color:#5f6368;font-weight:500;
  border-bottom:1px solid #eceff1}
td{padding:6px 9px;border-bottom:1px solid #f1f3f4}
tr:last-child td{border-bottom:0}
.raw{margin-top:6px}
.raw summary{cursor:pointer;font-size:11px;color:#1a73e8}
.raw pre{margin-top:6px;background:#f8f9fa;border:1px solid #eceff1;border-radius:6px;
  padding:8px;font-size:10.5px;overflow:auto;max-height:220px;white-space:pre-wrap;word-break:break-all}
.summary{margin:14px 0 0;padding:12px;border:1px solid #e0e3e7;border-radius:8px;background:#f8f9fa}
.summary h2{font-size:12.5px;margin-bottom:6px}
.summary p{font-size:12px;color:#3c4043;line-height:1.6}
.state{min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;padding:24px;text-align:center}
.state-t{font-size:14px;font-weight:500}
.state-m{font-size:12px;color:#5f6368;max-width:340px}
.spin{width:20px;height:20px;border:2px solid #e0e3e7;border-top-color:#1a73e8;border-radius:50%;
  animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#dbg{margin-top:14px;background:#1a1a1a;color:#d7ffd7;font:11px/1.5 ui-monospace,Consolas,monospace;
  padding:8px 10px;border-radius:8px;max-height:200px;overflow:auto}
</style>
</head>
<body>

<div id="app" class="hide">
  <div class="hdr">
    <div>
      <h1 id="hTitle">ClientCorporation file-read probe</h1>
      <p id="hSub">—</p>
    </div>
    <span class="pill">Diagnostic — not for daily use</span>
  </div>
  <div class="wrap" id="probes"></div>
  <div class="wrap"><div class="summary" id="summary"></div></div>
  <div class="wrap"><div id="dbg"></div></div>
</div>

<div class="state" id="stLoading">
  <div class="spin"></div>
  <div class="state-m" id="loadMsg">Loading…</div>
</div>
<div class="state hide" id="stNoConn">
  <div class="state-t">Not connected to Bullhorn</div>
  <div class="state-m">Open this card from a Client Corporation record.
    Add <code>?demo=1</code> to see the layout without live data.</div>
</div>

<script>
"use strict";
const DAY = 86400000;
const el = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytes = n => n==null ? '—' : n<1024 ? n+' B'
  : n<1048576 ? (n/1024).toFixed(1)+' KB' : (n/1048576).toFixed(1)+' MB';

/* ── debug log, always visible on this diagnostic card ─────────────── */
let t0 = null;
function dlog(msg){
  if(t0==null) t0 = (typeof performance!=='undefined') ? performance.now() : 0;
  const t = (((typeof performance!=='undefined') ? performance.now() : 0) - t0)/1000;
  console.log('[CorpFilesProbe]', msg);
  const box = el('dbg');
  if(box){ const row = document.createElement('div');
    row.textContent = `[+${t.toFixed(2)}s] ${msg}`; box.appendChild(row);
    box.scrollTop = box.scrollHeight; }
}

/* ── transport (same pattern/pin as forecast card) ──────────────────── */
const getParam = k => new URLSearchParams(location.search).get(k);
let regTries = 0, watchdog = null;
function register(){
  regTries++;
  dlog(`register() attempt ${regTries}/4`);
  if(typeof postRobot === 'undefined')
    return dlog('post-robot failed to load — check the script URL is reachable') || showNoConn();
  postRobot.sendToParent('register',{title:'ClientCorp Files Probe'},{timeout:5000})
    .then(()=>{ dlog('registered'); boot(); })
    .catch(()=> regTries<4 ? setTimeout(register,500) : (dlog('gave up after 4 attempts','e'), showNoConn()));
}
function unwrap(evt){
  const p = evt && evt.data;
  if(!p) throw new Error('Empty response');
  if(p.error) throw Object.assign(new Error('api'), {api:p.error});
  return p.data;
}
const bhGet = u => { dlog(`GET ${u}`);
  return postRobot.sendToParent('httpGET',{relativeURL:u},{timeout:20000}).then(unwrap); };

function showNoConn(){ el('app').classList.add('hide'); el('stLoading').classList.add('hide');
  el('stNoConn').classList.remove('hide'); }

/* ── the probes ──────────────────────────────────────────────────────
   Every plausible read path, tried independently so one failing doesn't
   hide whether the others work. Nothing here assumes an answer. */
function buildProbes(id){
  return [
    { key:'assoc-fileAttachments',
      name:'Current REST association: entity/ClientCorporation/{id}/fileAttachments',
      url:`entity/ClientCorporation/${id}/fileAttachments`
        + `?fields=id,name,type,contentType,fileSize,dateAdded,description,isPrivate&count=50`,
      note:'Not listed on ClientCorporation in the public entity reference — testing whether it works anyway.' },

    { key:'legacy-entityFiles',
      name:'Legacy endpoint: entityFiles/ClientCorporation/{id}',
      url:`entityFiles/ClientCorporation/${id}`,
      note:'Deprecated in Bullhorn’s own docs, but older tenants sometimes still serve it.' },

    { key:'search-fileAttachment',
      name:'Search the FileAttachment entity directly, filtered by parent',
      url:`search/FileAttachment?query=clientCorporation.id:${id}`
        + `&fields=id,name,type,contentType,fileSize,dateAdded,description,isPrivate&count=50`,
      note:'FileAttachment may be a standalone searchable entity independent of the association list.' },

    { key:'entity-expand',
      name:'Expand fileAttachments as a field on the ClientCorporation entity itself',
      url:`entity/ClientCorporation/${id}`
        + `?fields=id,name,fileAttachments(id,name,contentType,fileSize,dateAdded)&meta=off`,
      note:'Some tenants expose associations only when requested inline on the parent entity.' },
  ];
}

async function runProbe(p){
  const box = el('probes');
  const card = document.createElement('div');
  card.className = 'probe';
  card.innerHTML = `
    <div class="probe-hd">
      <span class="stat pending" id="st-${p.key}">·</span>
      <span class="probe-name">${esc(p.name)}</span>
    </div>
    <div class="probe-url">GET /${esc(p.url)}</div>
    <div class="probe-result" id="res-${p.key}">Running…</div>`;
  box.appendChild(card);

  try{
    const data = await bhGet(p.url);
    const rows = Array.isArray(data) ? data
      : (data && Array.isArray(data.data)) ? data.data
      : (data && Array.isArray(data.fileAttachments && data.fileAttachments.data))
        ? data.fileAttachments.data
      : null;

    if(rows && rows.length){
      el(`st-${p.key}`).className = 'stat ok'; el(`st-${p.key}`).textContent = '✓';
      el(`res-${p.key}`).className = 'probe-result';
      el(`res-${p.key}`).innerHTML = `<b>${rows.length} file${rows.length===1?'':'s'} found.</b> ${esc(p.note)}`
        + `<div class="rows"><table><thead><tr><th>Name</th><th>Type</th><th>Size</th>
           <th>Added</th></tr></thead><tbody>`
        + rows.slice(0,20).map(f=>`<tr><td>${esc(f.name||f.title||'—')}</td>`
          + `<td>${esc(f.contentType||f.type||'—')}</td><td>${bytes(f.fileSize)}</td>`
          + `<td>${f.dateAdded ? new Date(f.dateAdded).toLocaleDateString('en-GB') : '—'}</td></tr>`).join('')
        + `</tbody></table></div>`
        + `<details class="raw"><summary>Raw response</summary>`
        + `<pre>${esc(JSON.stringify(data,null,2)).slice(0,4000)}</pre></details>`;
      dlog(`${p.key}: OK — ${rows.length} rows`);
      return {key:p.key, status:'ok', count:rows.length};
    }

    el(`st-${p.key}`).className = 'stat empty'; el(`st-${p.key}`).textContent = '0';
    el(`res-${p.key}`).className = 'probe-result empty';
    el(`res-${p.key}`).innerHTML = `Request succeeded but returned no files. Either this path is `
      + `valid and the record genuinely has none, or the shape of the response wasn't what this `
      + `probe expected — check the raw response below.`
      + `<details class="raw"><summary>Raw response</summary>`
      + `<pre>${esc(JSON.stringify(data,null,2)).slice(0,4000)}</pre></details>`;
    dlog(`${p.key}: succeeded, 0 rows`);
    return {key:p.key, status:'empty', count:0};

  }catch(err){
    const raw = err && err.api ? err.api : err;
    const msg = (raw && (raw.errorMessage || raw.message)) || String(raw||err);
    el(`st-${p.key}`).className = 'stat fail'; el(`st-${p.key}`).textContent = '✕';
    el(`res-${p.key}`).className = 'probe-result fail';
    el(`res-${p.key}`).innerHTML = `<b>Failed:</b> ${esc(msg).slice(0,300)}`;
    dlog(`${p.key}: FAILED — ${msg}`);
    return {key:p.key, status:'fail', error:msg};
  }
}

async function boot(){
  const id = parseInt(getParam('EntityID'),10);
  dlog(`boot() — EntityID = ${JSON.stringify(getParam('EntityID'))}`);
  if(!id) return showNoConn();

  el('stLoading').classList.add('hide');
  el('app').classList.remove('hide');

  try{
    const corp = await bhGet(`entity/ClientCorporation/${id}?fields=id,name&meta=off`);
    const name = (corp.data || corp).name || `#${id}`;
    el('hSub').textContent = `${name} — testing every plausible read path, one at a time`;
    dlog(`resolved client name: "${name}"`);
  }catch(e){ el('hSub').textContent = `Client #${id}`; dlog(`could not resolve client name: ${e.message}`); }

  const probes = buildProbes(id);
  const results = [];
  for(const p of probes) results.push(await runProbe(p));  // sequential: one clean log per attempt

  const working = results.filter(r=>r.status==='ok');
  const empty   = results.filter(r=>r.status==='empty');
  const failed  = results.filter(r=>r.status==='fail');
  el('summary').innerHTML = `
    <h2>What this means</h2>
    <p>${working.length
      ? `<b>${working.map(r=>r.key).join(', ')}</b> returned real file rows — that's the path to build on.`
      : empty.length
        ? `No path returned files. ${empty.length} request${empty.length===1?'':'s'} succeeded but came back `
          + `empty — either this record has no attachments, or the response shape didn't match what the `
          + `probe looked for (open "Raw response" above to check by eye).`
        : `Every path failed outright. Check the error text on each — 403 means a permissions problem, `
          + `404 means the path itself doesn't exist on this tenant.`}
      ${failed.length ? ` ${failed.length} path${failed.length===1?'':'s'} errored outright.` : ''}
    </p>`;
}

function init(){
  if(getParam('demo')==='1') return runDemo();
  register();
  watchdog = setTimeout(()=>{
    if(!el('stLoading').classList.contains('hide')){ dlog('watchdog: still loading at 20s'); showNoConn(); }
  }, 20000);
}

/* ── demo mode: fabricated responses so the layout can be seen without BH ── */
function runDemo(){
  el('stLoading').classList.add('hide');
  el('app').classList.remove('hide');
  el('hSub').textContent = 'Demo Client Ltd — sample data, not connected to Bullhorn';
  const box = el('probes');
  const demo = [
    {name:'Current REST association: entity/ClientCorporation/{id}/fileAttachments',
     url:'entity/ClientCorporation/9/fileAttachments?fields=...', status:'fail',
     msg:'404 Not Found — no such association on this entity'},
    {name:'Legacy endpoint: entityFiles/ClientCorporation/{id}',
     url:'entityFiles/ClientCorporation/9', status:'ok',
     rows:[{name:'MSA - St John Ambulance.pdf',contentType:'application/pdf',fileSize:184320,
            dateAdded:Date.now()-400*DAY},
           {name:'Rate Card 2025.docx',contentType:'application/msword',fileSize:41200,
            dateAdded:Date.now()-90*DAY}]},
    {name:'Search the FileAttachment entity directly, filtered by parent',
     url:'search/FileAttachment?query=clientCorporation.id:9...', status:'empty'},
    {name:'Expand fileAttachments as a field on the ClientCorporation entity itself',
     url:'entity/ClientCorporation/9?fields=...fileAttachments(...)', status:'fail',
     msg:'400 Bad Request — unknown field "fileAttachments" on ClientCorporation'},
  ];
  demo.forEach(d=>{
    const card = document.createElement('div');
    card.className = 'probe';
    const icon = d.status==='ok'?'✓':d.status==='empty'?'0':'✕';
    const cls  = d.status==='ok'?'ok':d.status==='empty'?'empty':'fail';
    let body = '';
    if(d.status==='ok') body = `<b>${d.rows.length} files found.</b>`
      + `<div class="rows"><table><thead><tr><th>Name</th><th>Type</th><th>Size</th><th>Added</th></tr></thead>`
      + `<tbody>${d.rows.map(f=>`<tr><td>${esc(f.name)}</td><td>${esc(f.contentType)}</td>`
        + `<td>${bytes(f.fileSize)}</td><td>${new Date(f.dateAdded).toLocaleDateString('en-GB')}</td></tr>`).join('')}`
      + `</tbody></table></div>`;
    else if(d.status==='empty') body = 'Request succeeded but returned no files.';
    else body = `<b>Failed:</b> ${esc(d.msg)}`;
    card.innerHTML = `<div class="probe-hd"><span class="stat ${cls}">${icon}</span>`
      + `<span class="probe-name">${esc(d.name)}</span></div>`
      + `<div class="probe-url">GET /${esc(d.url)}</div>`
      + `<div class="probe-result ${d.status==='fail'?'fail':d.status==='empty'?'empty':''}">${body}</div>`;
    box.appendChild(card);
  });
  el('summary').innerHTML = `<h2>What this means</h2><p>Sample output only — in this fabricated example the `
    + `legacy <b>entityFiles</b> endpoint is the one that works. Run this for real against a live record to `
    + `see which path actually applies on your tenant.</p>`;
  dlog('demo mode — no AppBridge calls made');
}

window.addEventListener('load', init);
</script>
</body>
</html>

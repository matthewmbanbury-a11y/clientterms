<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ClientCorp Terms — read test</title>

<!--
  DIAGNOSTIC CARD, stage 2. Stage 1 (clientterms probe) already established
  the real read path on this tenant: entity/ClientCorporation/{id}/
  fileAttachments returns real rows even though it isn't in Bullhorn's
  public entity reference. This stage answers the one question that
  decides everything downstream: do these PDFs have a real text layer,
  or are they scanned images?

  If extraction yields substantial real text → client-side text extraction
  is viable, and the next build step is sending that text to a parsing
  service (never an AI key in this card — see the T&C conversation this
  card came out of). If extraction yields near-nothing → these are scans,
  OCR is required, and that only happens server-side. Either answer is a
  real, useful answer. Nothing here summarises or interprets the terms —
  it only proves whether the words are reachable at all.

  Handles three formats now: PDF (pdf.js, text-layer-vs-scan check), .docx
  (mammoth.js — a zip of XML, essentially always extractable, no OCR risk),
  and legacy binary .doc (pre-2007 format — explicitly reported as
  unsupported client-side rather than silently failing or being misread
  as a "scan", since that's a different problem needing a different fix
  — a format conversion, not OCR).

  pdf.js and mammoth.js both loaded from cdnjs, same reasoning as the
  post-robot pin: this card only exists to answer one factual question, so
  it uses whatever currently-published build does the job — no legacy wire
  protocol is involved here, so no reason to pin an old commit the way
  post-robot needed to.
-->
<script src="https://cdn.jsdelivr.net/gh/krakenjs/post-robot@7da06445/dist/post-robot.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#fff;color:#202124;font-size:13px;line-height:1.5}
.hide{display:none!important}
.hdr{padding:12px 14px;border-bottom:1px solid #e0e3e7;display:flex;justify-content:space-between;
  align-items:center;gap:10px;flex-wrap:wrap}
.hdr h1{font-size:14px;font-weight:700}
.hdr p{font-size:11px;color:#5f6368;margin-top:2px}
.pill{font-size:11px;padding:2px 9px;border-radius:999px;background:#fef7e0;color:#b06000;
  border:1px solid #f5deb0;font-weight:500;white-space:nowrap}
.wrap{padding:12px 14px}
.doc{border:1px solid #e0e3e7;border-radius:8px;margin-bottom:10px;overflow:hidden}
.doc-hd{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#f8f9fa;
  border-bottom:1px solid #eceff1}
.stat{width:18px;height:18px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;color:#fff}
.stat.pending{background:#dadce0;color:#5f6368}
.stat.ok{background:#1e8e3e}
.stat.warn{background:#f29900}
.stat.fail{background:#d93025}
.doc-name{font-size:12.5px;font-weight:500;flex:1;min-width:0;word-break:break-word}
.doc-meta{font-size:10.5px;color:#5f6368;font-family:ui-monospace,Consolas,monospace;
  padding:8px 12px;border-bottom:1px solid #eceff1;background:#fff}
.doc-body{padding:9px 12px;font-size:12px}
.doc-body.fail{color:#c5221f}
.doc-body.warn{color:#b06000}
.verdict{font-weight:700;margin-bottom:4px}
.excerpt{margin-top:8px;background:#f8f9fa;border:1px solid #eceff1;border-radius:6px;
  padding:9px;font-size:11.5px;line-height:1.6;max-height:180px;overflow:auto;white-space:pre-wrap}
.excerpt-lbl{font-size:10px;color:#5f6368;text-transform:uppercase;letter-spacing:.05em;
  font-weight:700;margin-bottom:4px}

.summary h2{font-size:12.5px;margin-bottom:6px}
.summary p{font-size:12px;color:#3c4043;line-height:1.6}

  gap:9px;padding:24px;text-align:center}

  animation:sp .8s linear infinite}

#dbg{margin-top:14px;background:#1a1a1a;color:#d7ffd7;font:11px/1.5 ui-monospace,Consolas,monospace;
  padding:8px 10px;border-radius:8px;max-height:200px;overflow:auto}
</style>
</head>
<body>

<div id="app" class="hide">
  <div class="hdr">
    <div>
      <h1>Terms documents — text-layer read test</h1>
      <p id="hSub">—</p>
    </div>
    <span class="pill">Diagnostic — not for daily use</span>
  </div>
  <div class="wrap" id="docs"></div>
  <div class="wrap"><div class="summary" id="summary"></div></div>
  <div class="wrap"><div id="dbg"></div></div>
</div>

<div class="state" id="stLoading">
  <div class="spin"></div>
  <div class="state-m" id="loadMsg">Loading…</div>
</div>
<div class="state hide" id="stNoConn">
  <div class="state-t">Not connected to Bullhorn</div>
  <div class="state-m">Open this card from a Client Corporation record.
    Add <code>?demo=1</code> to see the layout without live data.</div>
</div>

<script>
"use strict";
const el = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytes = n => n==null ? '—' : n<1024 ? n+' B'
  : n<1048576 ? (n/1024).toFixed(1)+' KB' : (n/1048576).toFixed(1)+' MB';

/* Only bother extracting from documents that look like the executed terms —
   signed, not superseded drafts — and skip anything unreasonably large for
   a browser-side base64 round trip. */
const MAX_BYTES = 5_000_000;
const looksLikeTerms = f => /terms|agreement|contract|msa|paye/i.test(f.name||'');
const preferSigned   = fs => {
  const signed = fs.filter(f=>/sign/i.test(f.name||''));
  return signed.length ? signed : fs;
};

let t0 = null;
function dlog(msg){
  if(t0==null) t0 = (typeof performance!=='undefined') ? performance.now() : 0;
  const t = (((typeof performance!=='undefined') ? performance.now() : 0) - t0)/1000;
  console.log('[TermsReadTest]', msg);
  const box = el('dbg');
  if(box){ const row = document.createElement('div');
    row.textContent = `[+${t.toFixed(2)}s] ${msg}`; box.appendChild(row);
    box.scrollTop = box.scrollHeight; }
}

const getParam = k => new URLSearchParams(location.search).get(k);
let regTries = 0, watchdog = null;
function register(){
  regTries++;
  dlog(`register() attempt ${regTries}/4`);
  if(typeof postRobot === 'undefined')
    return dlog('post-robot failed to load') || showNoConn();
  postRobot.sendToParent('register',{title:'Terms Read Test'},{timeout:5000})
    .then(()=>{ dlog('registered'); boot(); })
    .catch(()=> regTries<4 ? setTimeout(register,500) : (dlog('gave up after 4 attempts'), showNoConn()));
}
function unwrap(evt){
  const p = evt && evt.data;
  if(!p) throw new Error('Empty response');
  if(p.error) throw Object.assign(new Error('api'), {api:p.error});
  return p.data;
}
const bhGet = u => { dlog(`GET ${u}`);
  return postRobot.sendToParent('httpGET',{relativeURL:u},{timeout:25000}).then(unwrap); };
function showNoConn(){ el('app').classList.add('hide'); el('stLoading').classList.add('hide');
  el('stNoConn').classList.remove('hide'); }

/* ── pdf.js text extraction ─────────────────────────────────────────
   Pulls text from every page and reports it plainly. A near-empty result
   from a normal-sized PDF is the signal that it's a scanned image, not a
   failure of this code — that distinction is what this whole test exists
   to surface, so it's stated outright rather than left to be inferred. */
async function extractPdfText(bytesArr){
  const task = pdfjsLib.getDocument({data: bytesArr});
  const doc  = await task.promise;
  let text = '', pages = doc.numPages;
  for(let i=1;i<=Math.min(pages,15);i++){
    const page = await doc.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n';
  }
  return {text: text.trim(), pages};
}

function b64ToBytes(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

/* ── format detection ───────────────────────────────────────────────
   Filename extension first — it's the most reliable signal on this
   tenant's file records; contentType is a fallback when the name is
   ambiguous (some uploads carry a generic octet-stream content type). */
function fileKind(f){
  const name = (f.name||'').toLowerCase();
  if(name.endsWith('.docx')) return 'docx';
  if(name.endsWith('.doc'))  return 'doc';
  if(name.endsWith('.pdf'))  return 'pdf';
  const ct = (f.contentType||f.type||'').toLowerCase();
  if(ct.includes('wordprocessingml')) return 'docx';
  if(ct === 'application/msword')     return 'doc';
  if(ct.includes('pdf'))              return 'pdf';
  return 'other';
}

/* ── mammoth.js text extraction ─────────────────────────────────────
   .docx is a zip of XML, not an image, so there's no scan-vs-text
   ambiguity the way there is with PDF — this either works cleanly or
   throws. mammoth has no page concept, so pages comes back null. */
async function extractDocxText(bytesArr){
  const result = await mammoth.extractRawText({arrayBuffer: bytesArr.buffer});
  return {text: (result.value||'').trim(), pages: null};
}

async function runDoc(f, corpId){
  const box = el('docs');
  const card = document.createElement('div');
  card.className = 'doc';
  card.innerHTML = `
    <div class="doc-hd">
      <span class="stat pending" id="st-${f.id}">·</span>
      <span class="doc-name">${esc(f.name)}</span>
    </div>
    <div class="doc-meta">${esc(f.contentType||f.type||'—')} · ${bytes(f.fileSize)} · added
      ${f.dateAdded ? new Date(f.dateAdded).toLocaleDateString('en-GB') : '—'}</div>
    <div class="doc-body" id="res-${f.id}">Fetching content…</div>`;
  box.appendChild(card);

  if(f.fileSize && f.fileSize > MAX_BYTES){
    el(`st-${f.id}`).className = 'stat warn'; el(`st-${f.id}`).textContent = '!';
    el(`res-${f.id}`).className = 'doc-body warn';
    el(`res-${f.id}`).innerHTML = `<div class="verdict">Skipped — ${bytes(f.fileSize)} `
      + `is over the ${bytes(MAX_BYTES)} test limit.</div>`;
    dlog(`${f.name}: skipped, too large (${f.fileSize} bytes)`);
    return {name:f.name, status:'skipped'};
  }

  try{
    dlog(`fetching content for "${f.name}" (id ${f.id})`);
    /* Every other call in this card explicitly lists the fields it wants —
       this one didn't, and on ClientCorporation that came back without
       fileContent even though the call itself succeeded. Bullhorn's REST
       API generally withholds a heavy field like file content unless it's
       asked for by name, so that's the fix here. If this guess is wrong,
       the diagnostics below (keys + raw JSON snippet) show exactly what
       shape the response actually has, so the next run is the last one
       needed to know for sure. */
    const res = await bhGet(`file/ClientCorporation/${corpId}/${f.id}?fields=id,name,fileContent`);
    const payload = res.data || res;
    if(!payload || !payload.fileContent){
      const keys = payload && typeof payload==='object' ? Object.keys(payload).join(', ') : typeof payload;
      const rawDump = (()=>{ try{ return JSON.stringify(payload).slice(0,400); }catch(_){ return String(payload); } })();
      dlog(`${f.name}: no fileContent — keys returned: [${keys}]  raw: ${rawDump}`);
      throw new Error(`No fileContent in response (keys returned: ${keys||'none'})`);
    }

    const raw = b64ToBytes(payload.fileContent);
    const kind = fileKind(f);
    dlog(`${f.name}: decoded ${raw.length} bytes, kind=${kind}`);

    if(kind === 'doc'){
      el(`st-${f.id}`).className = 'stat warn'; el(`st-${f.id}`).textContent = '!';
      el(`res-${f.id}`).className = 'doc-body warn';
      el(`res-${f.id}`).innerHTML = `<div class="verdict">Legacy .doc — not readable client-side.</div>`
        + `This is the old binary Word format (pre-2007), not the .docx zip/XML format. No lightweight `
        + `browser library extracts text from it reliably. It would need converting to .docx or PDF `
        + `first — a format problem, not a scan/OCR problem, so treat this differently from the `
        + `PDF-scan case below.`;
      dlog(`${f.name}: LEGACY .DOC — unsupported client-side`);
      return {name:f.name, status:'unsupported-doc'};
    }

    if(kind === 'other'){
      el(`st-${f.id}`).className = 'stat warn'; el(`st-${f.id}`).textContent = '!';
      el(`res-${f.id}`).className = 'doc-body warn';
      el(`res-${f.id}`).innerHTML = `<div class="verdict">Unrecognised file type — `
        + `${esc(f.contentType||f.type||'unknown')}.</div>This test only handles PDF and Word (.docx) `
        + `right now, so it was skipped rather than guessed at.`;
      dlog(`${f.name}: UNKNOWN TYPE — skipped`);
      return {name:f.name, status:'unsupported-other'};
    }

    dlog(`${f.name}: extracting text…`);
    const {text, pages} = kind === 'docx' ? await extractDocxText(raw) : await extractPdfText(raw);
    const chars = text.length;

    if(kind === 'docx'){
      if(chars > 50){
        el(`st-${f.id}`).className = 'stat ok'; el(`st-${f.id}`).textContent = '✓';
        el(`res-${f.id}`).className = 'doc-body';
        el(`res-${f.id}`).innerHTML = `<div class="verdict">Real text — `
          + `${chars.toLocaleString()} characters extracted from this Word document.</div>`
          + `.docx is a zip of XML, not an image, so this is essentially always reliable — no OCR `
          + `risk the way a scanned PDF has.`
          + `<div class="excerpt"><div class="excerpt-lbl">First 500 characters, verbatim</div>`
          + `${esc(text.slice(0,500))}${text.length>500?'…':''}</div>`;
        dlog(`${f.name}: REAL TEXT (docx) — ${chars} chars`);
        return {name:f.name, status:'text', chars, pages:null};
      }
      el(`st-${f.id}`).className = 'stat warn'; el(`st-${f.id}`).textContent = '!';
      el(`res-${f.id}`).className = 'doc-body warn';
      el(`res-${f.id}`).innerHTML = `<div class="verdict">Almost no text extracted — `
        + `${chars} character${chars===1?'':'s'}.</div>Unusual for a .docx — the body may be mostly `
        + `tables, embedded images, or an empty template. Worth opening manually to check.`;
      dlog(`${f.name}: LOW TEXT (docx) — ${chars} chars`);
      return {name:f.name, status:'scan', chars, pages:null};
    }

    const wordsPerPage = chars / Math.max(pages,1) / 5.5; // rough words-per-page

    if(chars > 200 && wordsPerPage > 30){
      el(`st-${f.id}`).className = 'stat ok'; el(`st-${f.id}`).textContent = '✓';
      el(`res-${f.id}`).className = 'doc-body';
      el(`res-${f.id}`).innerHTML = `<div class="verdict">Real text layer — `
        + `${chars.toLocaleString()} characters across ${pages} page${pages===1?'':'s'}.</div>`
        + `This document is readable without OCR.`
        + `<div class="excerpt"><div class="excerpt-lbl">First 500 characters, verbatim</div>`
        + `${esc(text.slice(0,500))}${text.length>500?'…':''}</div>`;
      dlog(`${f.name}: REAL TEXT — ${chars} chars, ${pages} pages`);
      return {name:f.name, status:'text', chars, pages};
    }

    el(`st-${f.id}`).className = 'stat warn'; el(`st-${f.id}`).textContent = '!';
    el(`res-${f.id}`).className = 'doc-body warn';
    el(`res-${f.id}`).innerHTML = `<div class="verdict">Little or no extractable text — `
      + `${chars} character${chars===1?'':'s'} across ${pages} page${pages===1?'':'s'}.</div>`
      + `This almost certainly means the PDF is a scanned image, not real text. `
      + `Extraction here would need OCR, which has to run server-side.`
      + (chars ? `<div class="excerpt"><div class="excerpt-lbl">Everything extracted</div>`
        + `${esc(text)}</div>` : '');
    dlog(`${f.name}: LIKELY SCAN — only ${chars} chars across ${pages} pages`);
    return {name:f.name, status:'scan', chars, pages};

  }catch(err){
    const raw = err && err.api ? err.api : err;
    const msg = (raw && (raw.errorMessage || raw.message)) || String(raw||err);
    el(`st-${f.id}`).className = 'stat fail'; el(`st-${f.id}`).textContent = '✕';
    el(`res-${f.id}`).className = 'doc-body fail';
    el(`res-${f.id}`).innerHTML = `<b>Failed:</b> ${esc(msg).slice(0,300)}`;
    dlog(`${f.name}: FAILED — ${msg}`);
    return {name:f.name, status:'fail', error:msg};
  }
}

async function boot(){
  const id = parseInt(getParam('EntityID'),10);
  dlog(`boot() — EntityID = ${JSON.stringify(getParam('EntityID'))}`);
  if(!id) return showNoConn();

  el('stLoading').classList.add('hide');
  el('app').classList.remove('hide');

  let files = [];
  try{
    const corp = await bhGet(`entity/ClientCorporation/${id}?fields=id,name&meta=off`);
    const name = (corp.data || corp).name || `#${id}`;
    const list = await bhGet(`entity/ClientCorporation/${id}/fileAttachments`
      + `?fields=id,name,type,contentType,fileSize,dateAdded&count=50`);
    files = (list.data || []).filter(looksLikeTerms);
    if(!files.length) files = list.data || [];
    files = preferSigned(files);
    el('hSub').textContent = `${name} — reading ${files.length} document`
      + `${files.length===1?'':'s'} to check for a real text layer`;
    dlog(`resolved "${name}", testing ${files.length} of ${(list.data||[]).length} total files`);
  }catch(e){
    el('hSub').textContent = `Client #${id} — could not list files`;
    dlog(`file list failed: ${e.message}`);
    el('summary').innerHTML = `<h2>What this means</h2><p>Could not even list files — `
      + `check the clientterms probe card first to confirm the read path still works.</p>`;
    return;
  }

  const results = [];
  for(const f of files) results.push(await runDoc(f, id));  // sequential, one clean log per doc

  const real = results.filter(r=>r.status==='text');
  const scan = results.filter(r=>r.status==='scan');
  const fail = results.filter(r=>r.status==='fail');
  const unsupDoc   = results.filter(r=>r.status==='unsupported-doc');
  const unsupOther = results.filter(r=>r.status==='unsupported-other');
  el('summary').innerHTML = `
    <h2>What this means</h2>
    <p>${real.length && !scan.length
      ? `Every document tested has a real text layer. Client-side extraction into a parsing `
        + `pipeline is viable for this client's documents — no OCR needed.`
      : real.length && scan.length
        ? `${real.length} of ${results.length} document${results.length===1?'':'s'} had real text; `
          + `${scan.length} looked like scanned image${scan.length===1?'':'s'} or near-empty extracts. `
          + `Extraction needs to handle both cases — text documents client-side, scans routed to OCR.`
        : scan.length
          ? `All tested documents look like scanned images or produced near-empty extracts. Text `
            + `extraction here needs OCR, which means this has to run server-side, not in the card.`
          : `No document produced a clear result — check the individual entries above.`}
      ${fail.length ? ` ${fail.length} document${fail.length===1?'':'s'} failed to fetch outright.` : ''}
      ${unsupDoc.length ? ` ${unsupDoc.length} document${unsupDoc.length===1?'':'s'} ${unsupDoc.length===1?'is':'are'} `
        + `legacy .doc files — not readable client-side; would need converting to .docx or PDF first.` : ''}
      ${unsupOther.length ? ` ${unsupOther.length} document${unsupOther.length===1?'':'s'} `
        + `${unsupOther.length===1?'was':'were'} an unrecognised file type and ${unsupOther.length===1?'was':'were'} skipped.` : ''}
    </p>`;
}

function init(){
  if(getParam('demo')==='1') return runDemo();
  register();
  watchdog = setTimeout(()=>{
    if(!el('stLoading').classList.contains('hide')){ dlog('watchdog: still loading at 25s'); showNoConn(); }
  }, 25000);
}

/* ── demo mode ─────────────────────────────────────────────────────── */
function runDemo(){
  el('stLoading').classList.add('hide');
  el('app').classList.remove('hide');
  el('hSub').textContent = 'Demo Client Ltd — sample data, not connected to Bullhorn';
  const box = el('docs');
  const demo = [
    {name:'v1.0 Demo Client Gravitas Contract Terms CSigned.pdf', type:'application/pdf',
     fileSize:496000, status:'text', chars:14200, pages:6,
     excerpt:'CONTRACT FOR SERVICES\n\nThis Agreement is made between Gravitas Group ("the Agency") '
       + 'and Demo Client Ltd ("the Client")...\n\n1. INTRODUCTION FEE\n1.1 The Agency\'s fee for the '
       + 'introduction of a Candidate who is engaged by the Client shall be 18% of the first annual...'},
    {name:'v1.0 Demo Client Gravitas PAYE Terms CSigned.pdf', type:'application/pdf',
     fileSize:410000, status:'scan', chars:44, pages:3},
    {name:'v2.0 Demo Client Gravitas Rebate Schedule CSigned.docx',
     type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
     fileSize:38000, status:'text', chars:6100, pages:null,
     excerpt:'REBATE SCHEDULE — SCHEDULE 2\n\nWhere a placed Candidate leaves the Client\'s employment '
       + 'within the Rebate Period, the Agency shall refund the Client on a sliding scale: 0-4 weeks '
       + '100%, 5-8 weeks 50%, 9-12 weeks 25%, thereafter nil...'},
    {name:'Legacy Demo Client Terms 2011.doc', type:'application/msword',
     fileSize:88000, status:'unsupported-doc'},
  ];
  demo.forEach(d=>{
    const card = document.createElement('div');
    card.className = 'doc';
    const icon = d.status==='text' ? '✓' : '!';
    const cls  = d.status==='text' ? 'ok' : 'warn';
    let body;
    if(d.status==='text'){
      const suffix = d.pages ? ` across ${d.pages} pages` : ' from this Word document';
      body = `<div class="verdict">Real text${d.pages?' layer':''} — ${d.chars.toLocaleString()} `
        + `characters${suffix}.</div>This document is readable without OCR.`
        + `<div class="excerpt"><div class="excerpt-lbl">First 500 characters, verbatim</div>`
        + `${esc(d.excerpt)}</div>`;
    } else if(d.status==='scan'){
      body = `<div class="verdict">Little or no extractable text — ${d.chars} characters across `
        + `${d.pages} pages.</div>This almost certainly means the PDF is a scanned image.`;
    } else {
      body = `<div class="verdict">Legacy .doc — not readable client-side.</div>This is the old `
        + `binary Word format (pre-2007), not the .docx zip/XML format. It would need converting `
        + `to .docx or PDF first — a format problem, not a scan/OCR problem.`;
    }
    card.innerHTML = `<div class="doc-hd"><span class="stat ${cls}">${icon}</span>`
      + `<span class="doc-name">${esc(d.name)}</span></div>`
      + `<div class="doc-meta">${esc(d.type)} · ${bytes(d.fileSize)} · added 24/12/2025</div>`
      + `<div class="doc-body ${d.status!=='text'?'warn':''}">${body}</div>`;
    box.appendChild(card);
  });
  el('summary').innerHTML = `<h2>What this means</h2><p>Sample output only, showing all four cases `
    + `this card now handles: a PDF with a real text layer, a scanned PDF, a .docx with real text, `
    + `and a legacy .doc reported as unsupported rather than misread as a scan. `
    + `Run this for real to see which of these is true for your documents.</p>`;
  dlog('demo mode — no AppBridge calls made');
}

window.addEventListener('load', init);
</script>
</body>
</html>
